<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 🌹</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="ambient ambient-1"></div>
        <div class="ambient ambient-2"></div>
        <div class="stars"></div>
    </div>

    <!-- Intro -->
    <main class="intro" id="intro">

        <div class="intro-card">

            <div class="small-label">
                برای یک نفر خاص
            </div>

            <h1>
                یه چیزی برات دارم
            </h1>

            <p>
                فقط چند ثانیه بهم فرصت بده...
            </p>

            <button class="start-button" id="startButton">
                <span>بازش کن</span>
                <span class="button-arrow">✦</span>
            </button>

        </div>

    </main>


    <!-- Rose Scene -->
    <main class="scene" id="scene">

        <div class="scene-light"></div>

        <div class="rose-container" id="roseContainer">

            <svg class="rose" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" aria-label="Rose">

                <defs>

                    <!-- Rose red gradient -->
                    <linearGradient id="petalGradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ff6b81" />
                        <stop offset="45%" stop-color="#e63956" />
                        <stop offset="100%" stop-color="#7d1026" />
                    </linearGradient>


                    <linearGradient id="petalDark" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ff4968" />
                        <stop offset="100%" stop-color="#590819" />
                    </linearGradient>


                    <!-- Stem -->
                    <linearGradient id="stemGradient" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#173d28" />
                        <stop offset="50%" stop-color="#3f9a55" />
                        <stop offset="100%" stop-color="#102b1c" />
                    </linearGradient>


                    <!-- Leaf -->
                    <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#67c875" />
                        <stop offset="50%" stop-color="#2e7d46" />
                        <stop offset="100%" stop-color="#123d25" />
                    </linearGradient>


                    <!-- Rose glow -->
                    <filter id="roseGlow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="blur" />

                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>


                    <!-- Soft shadow -->
                    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="15" stdDeviation="12" flood-opacity="0.5" />
                    </filter>

                </defs>


                <!-- ===================== -->
                <!-- STEM -->
                <!-- ===================== -->

                <g class="stem">

                    <path d="M250 660
                           C248 590 254 520 248 430
                           C245 380 252 330 250 275" fill="none" stroke="url(#stemGradient)" stroke-width="15"
                        stroke-linecap="round" />

                    <path d="M252 660
                           C255 580 252 520 250 430" fill="none" stroke="#65b96d" stroke-opacity="0.35"
                        stroke-width="4" stroke-linecap="round" />

                </g>


                <!-- ===================== -->
                <!-- LEAVES -->
                <!-- ===================== -->

                <g class="leaves">

                    <!-- Left leaf -->
                    <path class="leaf leaf-left" d="M250 510
                           C215 485 165 485 120 515
                           C158 555 211 553 250 510Z" fill="url(#leafGradient)" filter="url(#softShadow)" />

                    <path class="leaf-vein" d="M240 515 C195 510 160 515 128 524" fill="none" stroke="#9ae49c"
                        stroke-opacity="0.35" stroke-width="3" />


                    <!-- Right leaf -->
                    <path class="leaf leaf-right" d="M252 425
                           C290 395 340 398 382 425
                           C345 464 295 464 252 425Z" fill="url(#leafGradient)" filter="url(#softShadow)" />

                    <path class="leaf-vein" d="M262 430 C305 425 340 425 375 428" fill="none" stroke="#9ae49c"
                        stroke-opacity="0.35" stroke-width="3" />

                </g>


                <!-- ===================== -->
                <!-- ROSE -->
                <!-- ===================== -->

                <g class="rose-flower" filter="url(#roseGlow)">

                    <!-- Outer shadow petals -->

                    <path class="petal outer outer-1" d="M250 275
                           C175 275 115 235 125 170
                           C135 105 195 78 250 110
                           C305 78 365 105 375 170
                           C385 235 325 275 250 275Z" fill="url(#petalDark)" />


                    <!-- Left outer petal -->

                    <path class="petal outer outer-2" d="M250 260
                           C180 275 125 235 130 180
                           C135 135 165 105 205 100
                           C175 150 180 205 250 260Z" fill="url(#petalGradient)" />


                    <!-- Right outer petal -->

                    <path class="petal outer outer-3" d="M250 260
                           C320 275 375 235 370 180
                           C365 135 335 105 295 100
                           C325 150 320 205 250 260Z" fill="url(#petalGradient)" />


                    <!-- Top petal -->

                    <path class="petal outer outer-4" d="M250 260
                           C205 225 190 180 205 125
                           C215 90 235 72 250 70
                           C265 72 285 90 295 125
                           C310 180 295 225 250 260Z" fill="url(#petalGradient)" />


                    <!-- Middle petals -->

                    <path class="petal middle middle-1" d="M250 250
                           C205 245 170 220 168 185
                           C166 155 185 132 210 120
                           C205 170 220 205 250 250Z" fill="#d92e4c" />


                    <path class="petal middle middle-2" d="M250 250
                           C295 245 330 220 332 185
                           C334 155 315 132 290 120
                           C295 170 280 205 250 250Z" fill="#d92e4c" />


                    <!-- Inner rose -->

                    <path class="petal inner inner-1" d="M250 245
                           C220 220 208 190 220 160
                           C228 140 244 128 250 125
                           C256 128 272 140 280 160
                           C292 190 280 220 250 245Z" fill="url(#petalDark)" />


                    <path class="petal inner inner-2" d="M250 230
                           C235 212 232 190 240 172
                           C245 161 249 157 250 155
                           C251 157 255 161 260 172
                           C268 190 265 212 250 230Z" fill="#ff7890" />


                    <!-- Center -->

                    <path class="rose-center" d="M250 215
                           C235 205 236 185 250 176
                           C264 185 265 205 250 215Z" fill="#7d1026" />

                    <path class="center-highlight" d="M250 185
                           C255 190 256 198 250 203
                           C244 198 245 190 250 185Z" fill="#ff9cad" fill-opacity="0.75" />

                </g>

            </svg>

        </div>


        <!-- Floating particles -->

        <div class="particles" id="particles"></div>


        <!-- Final message -->

        <div class="final-message" id="finalMessage">

            <div class="message-line"></div>

            <span class="message-small">
                برای تو
            </span>

            <h2>
                🌹
            </h2>

            <p>
                این یکی رو خودم برات کشیدم.
            </p>

        </div>


        <button class="replay-button" id="replayButton">
            دوباره ببین
        </button>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
